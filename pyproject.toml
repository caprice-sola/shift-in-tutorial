[project]
name = "snip"
version = "0.1.0"
description = "A tiny URL shortener — workshop starter application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
# System/E2E only (tests/system/): spins up a real server process, so it's
# slow. Kept out of [test] so the fast unit+api job (and its Stop hook) never
# installs or runs it.
system = [
    "robotframework>=7.0",
    "robotframework-requests>=0.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snip"]
