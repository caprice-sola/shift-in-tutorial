[project]
name = "snip"
version = "0.1.0"
description = "A tiny URL shortener — workshop starter application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2",  # required by starlette.testclient.TestClient in this FastAPI version
]
# Separate extra (M4): the fast unit+API CI step doesn't need Robot Framework
# installed at all - only the slower system-test CI stage does.
system = [
    "robotframework>=7",
    "robotframework-requests>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
