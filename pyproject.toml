[project]
name = "snip"
version = "0.1.0"
description = "A tiny URL shortener — workshop starter application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# robotframework is intentionally NOT listed here - that's M4's job, at the
# system-test level. httpx is pulled in transitively for FastAPI's TestClient.
[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "mutmut>=3",
    "httpx2",  # required by starlette.testclient.TestClient in this FastAPI version
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/snip/shortener.py"]
