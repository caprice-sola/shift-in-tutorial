# CI: created in M3b, complete rather than as a stub. Step 1 is the sanity
# check (package installs and imports with ONLY production deps - catches a
# test-only import accidentally leaking into src/snip/), then the test suite
# written in M3a: unit + API tests, plus one
# SLI-derived gate (SLI 1 - redirect p95 latency, docs/slis.md). One job,
# labeled steps rather than a second job/runner - the app is tiny enough
# that splitting would only add GitHub Actions overhead for no benefit.
#
# The gate step is a separate `pytest` invocation, not folded into the tests
# step, so a CI failure clearly shows which of "a test broke" vs "an SLI was
# violated" happened - the gate spins up a real server and is meaningfully
# slower than the unit/API suite, which is also why it's NOT part of the
# Stop hook's fast in-loop check (M3a): see docs/test-strategy.md.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - name: "Sanity: production install imports cleanly (no test-only deps)"
        run: python -c "from snip.main import app"
      - run: pip install -e ".[test]"
      - name: Unit + API tests
        run: pytest tests/unit tests/api -q
      - name: "SLI gate: redirect p95 latency < 50ms (docs/slis.md SLI 1)"
        run: pytest tests/gates -q -s
