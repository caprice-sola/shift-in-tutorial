# Minimal CI workflow — added at the end of M3a, once tests exist locally and
# the Stop hook runs them in-loop. It deliberately does NOT run the test suite
# yet: that's M3b, together with an SLI-derived gate. What it does prove is that
# the package installs and imports with ONLY production dependencies
# (import snip.main pulls in models/shortener/store too) - the check that later
# catches a test-only import leaking into src/snip/.
name: CI

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - run: python -c "from snip.main import app"
