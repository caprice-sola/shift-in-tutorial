# CI: the fast job (M3a/M3b) - production-install sanity check, unit+API
# tests, and the SLI 1 latency gate - plus a separate, slower system-tests
# job (M4) running the Robot Framework suite. Two jobs, not two steps in one
# job: GitHub Actions runs jobs in parallel by default, so splitting the slow
# system suite out doesn't add to the fast job's turnaround, and a reviewer
# can see at a glance which layer failed. system-tests installs only the
# `system` extra - it doesn't need pytest/httpx2 at all, it drives the app
# over real HTTP via Robot Framework's RequestsLibrary.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - name: "Sanity: production install imports cleanly (no test-only deps)"
        run: python -c "from snip.main import app"
      - run: pip install -e ".[test]"
      - name: Unit + API tests
        run: pytest tests/unit tests/api -q
      - name: "SLI gate: redirect p95 latency < 50ms (docs/slis.md SLI 1)"
        run: pytest tests/gates -q -s

  system-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[system]"
      - name: "System tests (Robot Framework): redirect hot path + cross-cutting flows"
        run: robot --outputdir robot-results tests/system/
      - name: Upload Robot Framework report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results
          path: robot-results/
