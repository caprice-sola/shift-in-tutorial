# CI: unit + API tests, plus one SLI-derived gate (SLI 1 - redirect p95
# latency, docs/slis.md), on every push and PR. The M2 sanity-only stub is
# gone now that there's a real suite to run (M3a). One job, two labeled
# steps rather than a second job/runner - the app is tiny enough that
# splitting would only add GitHub Actions overhead for no benefit.
#
# The gate step is a separate `pytest` invocation, not folded into the first
# one, so a CI failure clearly shows which of "a test broke" vs "an SLI was
# violated" happened - the gate spins up a real server and is meaningfully
# slower than the unit/API suite, which is also why it's NOT part of the
# Stop hook's fast in-loop check (M3a): see docs/test-strategy.md.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[test]"
      - name: Unit + API tests
        run: pytest tests/unit tests/api -q
      - name: "SLI gate: redirect p95 latency < 50ms (docs/slis.md SLI 1)"
        run: pytest tests/gates -q -s
